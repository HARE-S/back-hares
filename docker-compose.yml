# Stack completo HARE-S (ver guide/deployment.md y arquitectura_del_stack_docker.md).
# Requisito: back-hares/ y front-hares/ deben existir como carpetas hermanas (repos git separados).
# Red externa previa: docker network create public
#
# Único servicio que publica puertos al exterior: proxy (80:80).

services:
  database:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: hares_database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hares_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hares_pass}
      POSTGRES_DB: ${POSTGRES_DB:-hares_db}
    volumes:
      - data_dir:/var/lib/postgresql
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hares_user} -d ${POSTGRES_DB:-hares_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    image: hares-backend:latest
    container_name: hares_backend
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-hares-penascal-2026-min-32-chars}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-true}
      SESSION_TYPE: ${SESSION_TYPE:-sqlalchemy}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      POSTGRES_USER: ${POSTGRES_USER:-hares_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hares_pass}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hares_db}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - db-network
      - backend-network

  import:
    build: .
    image: hares-backend:latest
    profiles: ["tools"]
    command: ["python", "-m", "app.importer"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-hares-penascal-2026-min-32-chars}
      POSTGRES_USER: ${POSTGRES_USER:-hares_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hares_pass}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hares_db}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - db-network

  frontend:
    build: ../front-hares
    image: hares-frontend:latest
    container_name: hares_frontend
    restart: always
    networks:
      - frontend-network

  proxy:
    image: ${NGINX_IMAGE:-nginx:1.31.5-alpine}
    container_name: hares_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public
      - backend-network
      - frontend-network
    depends_on:
      - backend
      - frontend

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    container_name: hares_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@penascal.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_dev_pass}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - db-network
    depends_on:
      database:
        condition: service_healthy

volumes:
  data_dir:
  pgadmin_data:

networks:
  db-network:
  backend-network:
  frontend-network:
  public:
    external: true